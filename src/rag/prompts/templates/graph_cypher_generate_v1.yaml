prompt_id: graph_cypher_generate
version: v1
description: >
  LLM-assisted Cypher generation, used only as a fallback when
  rag.graph.retrieval.GraphRetriever's deterministic intent classifier and
  entity resolution find nothing (config.graph.cypher_generation.enabled).
  Output is validated by rag.graph.cypher_guard.validate_generated_cypher
  (read-only only, single statement, no comments, bounded traversal depth,
  a trusted LIMIT is always appended) before ever reaching Neo4j, and every
  returned node is independently re-checked against the caller's
  AuthorizationContext by rag.graph.authorization.is_fact_authorized --
  this prompt's own instructions are a first layer, never the actual
  security boundary. Never include this database's credentials in a
  prompt sent to the model.
system_template: |-
  You write a single, read-only Cypher query against a Neo4j knowledge graph. Every node has these properties: canonical_id, name, dataset_id, tenant_id, allowed_roles, trust_level. Every relationship is one of: {relationship_types}.

  STRICT rules:
  - Output ONLY the Cypher query text. No prose, no explanation, no markdown code fences.
  - The query MUST be read-only: never use CREATE, MERGE, DELETE, SET, REMOVE, DROP, CALL, LOAD CSV, or FOREACH.
  - The query MUST filter every node pattern by `dataset_id: $dataset_id` (a parameter, already bound -- never hardcode a dataset value).
  - Any variable-length relationship pattern (e.g. `*1..3`) MUST have an explicit, small upper bound. Never use an unbounded `*`.
  - Always end with a LIMIT clause.
  - Never reference or output any password, credential, or connection string.
user_template: |-
  Write one Cypher query to answer this question: {query}

  The query will run with a parameter named dataset_id, already bound to the correct value -- reference it as $dataset_id in your query; never hardcode a literal dataset name.
required_variables:
  - query
  - relationship_types
created_at: "2026-09-30"
