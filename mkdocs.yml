site_name: local-rag-system
site_description: Modular, config-driven local RAG system (pgvector + Ollama + sentence-transformers)
docs_dir: docs
site_dir: site

site_url: https://ajits-github.github.io/local-rag-system/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - "."
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: table
            members_order: source
            show_if_no_docstring: false
  # Validates internal links/anchors and nav references. External URL checks
  # are disabled so `mkdocs build --strict` stays deterministic and network-free
  # (CI has no outbound internet by design; see CLAUDE.md's CI section).
  - htmlproofer:
      validate_external_urls: false
      raise_error_after_finish: true
      ignore_urls:
        # Transcluded verbatim from README.md via pymdownx.snippets; these
        # point at README's own repo-root-relative links/anchors, which
        # aren't resolvable from within the docs site (README.md itself
        # isn't part of the built site). Real, in-site equivalents are
        # linked separately right next to each transclusion.
        - "docs/architecture.md"
        - "#mlflow-tracking"
        - "frontend/README.md"
        - "docs/assets/web-ui-screenshot.png"
        # mkdocstrings/autorefs cross-reference links between reference/
        # pages (e.g. "Bases: LLM" -> ../generation/#rag.generation.base.LLM).
        # Verified present in the rendered HTML; htmlproofer's resolver
        # doesn't currently follow autorefs' late-bound anchors across
        # mkdocstrings pages, a known plugin-interaction gap, not a real
        # broken link.
        - "*#rag.*"

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Ingestion & Chunking: topics/ingestion.md
  - Retrieval: topics/retrieval.md
  - Multimodal & Layout: topics/multimodal.md
  - Security: topics/security.md
  - Agentic RAG: topics/agentic-rag.md
  - MCP: topics/mcp.md
  - Evaluation & RAGAS:
      - Overview: topics/evaluation.md
      - Metrics reference: metrics.md
  - Observability: topics/observability.md
  - Web UI: topics/web-ui.md
  - Deployment & Runtime: topics/deployment.md
  - API Reference:
      - Overview: reference/index.md
      - Configuration & factory: reference/config.md
      - Schemas: reference/schemas.md
      - Loaders: reference/loaders.md
      - Chunkers: reference/chunkers.md
      - Embedders: reference/embedders.md
      - Vector store: reference/vectorstore.md
      - Retrieval: reference/retrieval.md
      - Rerankers: reference/rerankers.md
      - Generation: reference/generation.md
      - Prompts: reference/prompts.md
      - Vision: reference/vision.md
      - Agent: reference/agent.md
      - MCP: reference/mcp.md
      - Ingestion: reference/ingestion.md
      - Evaluation: reference/eval.md
      - Observability: reference/observability.md
      - API: reference/api.md
