# Fixed name "frontend" -- referenced directly by templates/ingress.yaml's
# backend and by k8s/minikube's `minikube service frontend` convenience
# command. See README's "Why object names are fixed" section.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
