{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag-system.serviceAccountName" . }}
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken defaults to true on the ServiceAccount object
# itself but is explicitly disabled per-pod (see rag-api/deployment.yaml and
# frontend/deployment.yaml) -- neither workload calls the Kubernetes API, so
# neither needs a token mounted into it at all. See rbac.yaml/values.yaml's
# `rbac.create` comment for the same reasoning applied to RBAC.
automountServiceAccountToken: false
{{- end }}
