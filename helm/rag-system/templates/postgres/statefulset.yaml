# StatefulSet, not Deployment -- stable network identity
# (postgres-0.postgres...) and stable per-ordinal storage via
# volumeClaimTemplates. See k8s/base/postgres-statefulset.yaml's own comment
# for the full reasoning (unchanged by this chart). Fixed name "postgres" --
# see README's "Why object names are fixed" section.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app: postgres
spec:
  serviceName: postgres
  # Deliberately not templated to more than 1: this is StatefulSet primitive
  # for "one placeholder-safe, recreatable instance with its own durable
  # disk," not a real primary/replica Postgres topology (see
  # k8s/base/postgres-statefulset.yaml's comment) -- scaling it would just
  # create independent, unreplicated Postgres instances.
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        {{- include "rag-system.selectorLabels" . | nindent 8 }}
        app: postgres
      annotations:
        checksum/config: {{ include (printf "%s/templates/configmap.yaml" .Chart.Name) . | sha256sum }}
        checksum/secret: {{ include (printf "%s/templates/secret.yaml" .Chart.Name) . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds }}
      # fsGroup (above) makes the mounted volumes group-writable by gid 999,
      # but a `subPath` mount's target subdirectory is auto-created
      # owner:root regardless of fsGroup (a known Kubernetes behavior, hit
      # for real running this chart: postgres's own entrypoint does
      # `chmod 0700 $PGDATA` unconditionally at first-run init, and chmod
      # requires actually OWNING the path, not just group-write access to
      # it). This one-shot, root-privileged initContainer chowns the exact
      # mounted paths to uid/gid 999 before the non-root main container
      # starts -- same pattern real-world Postgres Helm charts use for this
      # exact problem.
      #
      # `DAC_OVERRIDE` is required here, not just `CHOWN`/`FOWNER` -- a real
      # bug hit and fixed while demoing this chart, not a theoretical
      # concern. `CAP_CHOWN`/`CAP_FOWNER` only govern *changing* ownership
      # and bypassing owner checks on metadata ops (chmod/utime); they do
      # NOT let root traverse or read a directory it doesn't already own.
      # On a fresh, empty, root-owned PVC this container works fine even
      # without `DAC_OVERRIDE` -- but postgres itself chmods $PGDATA to
      # 0700 owned by uid 999 on first init, so on every *subsequent*
      # `helm upgrade`/pod restart against that same PVC, this initContainer
      # (running as uid 0 with only CHOWN+FOWNER) can no longer even `ls`
      # into the existing 0700-owned-by-999 directory to re-chown it --
      # confirmed directly with a throwaway debug pod reproducing the exact
      # "Permission denied" on `ls`/`chown` without `DAC_OVERRIDE`, and the
      # same pod succeeding once it was added. `drop: ["ALL"]` plus these
      # three explicit capabilities is still far narrower than unrestricted
      # root.
      initContainers:
        - name: fix-pgdata-ownership
          image: busybox:1.36
          command: ["chown", "-R", "999:999", "/var/lib/postgresql/data", "/var/run/postgresql"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: run-postgresql
              mountPath: /var/run/postgresql
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: rag-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-system.secretName" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              # pgvector's image writes directly into the mount root, which
              # trips Postgres's "directory not empty" check when the PVC's
              # filesystem has a lost+found dir. subPath sidesteps it, same
              # effect as docker-compose's own named-volume mount.
              subPath: pgdata
            - name: run-postgresql
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.config.postgresUser }}", "-d", "{{ .Values.config.postgresDb }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.config.postgresUser }}", "-d", "{{ .Values.config.postgresDb }}"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            # Not readOnlyRootFilesystem here, unlike rag-api/frontend: the
            # official postgres entrypoint chmods/chowns its data directory
            # and creates auxiliary files directly under /var/lib/postgresql
            # (a few levels above the pgdata subPath mount) during first-run
            # initialization, not only inside the mounted volume -- verified
            # against a real init run, not assumed. /var/run/postgresql and
            # /tmp are still isolated onto their own emptyDirs above, since
            # those genuinely are practical to lock down independently.
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: run-postgresql
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.postgres.persistence.enabled }}
        - name: pgdata
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
