{{- if .Values.secret.create }}
{{- if .Values.secret.existingSecret }}
{{- fail "secret.create=true and secret.existingSecret are mutually exclusive -- set one or the other." }}
{{- end }}
# stringData lets us write plain values here; Kubernetes base64-encodes them
# into `data` on write, same convention as k8s/base/secret-app.example.yaml.
# These defaults are the exact same non-sensitive local-dev values already
# committed there -- never a real credential. For anything beyond local
# learning, set secret.existingSecret instead (see values-prod.yaml) and
# create the real Secret out-of-band (kubectl, sealed-secrets, external-secrets,
# etc.) so credentials never live in `helm get values`/release history at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-system.secretName" . }}
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres.%s.svc.cluster.local:5432/%s" .Values.config.postgresUser .Values.secret.postgresPassword .Release.Namespace .Values.config.postgresDb | quote }}
  JWT_HS256_SECRET: {{ .Values.secret.jwtHs256Secret | quote }}
  COHERE_API_KEY: {{ .Values.secret.cohereApiKey | quote }}
{{- end }}
