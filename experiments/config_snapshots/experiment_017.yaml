# Stage B of the retrieval-cutoff-semantics milestone: the controlled
# reranker experiment. Identical to multimodal-v2-relationship-qwen3b.yaml
# (the Stage B baseline, itself experiment_015's config under the new
# candidate_k/reranker.top_n/generation_context_top_n field names) except
# reranker.provider is cross_encoder instead of none. That is the ONLY
# intentional difference -- embedding, chunking, generation model, prompt,
# hybrid retrieval, RRF k, relationship expansion, dataset, and
# generation_context_top_n are all unchanged, so any metric delta between
# the two runs isolates the reranker's effect.
#
# candidate_k stays at 5 (matching the baseline/historical top_k=5): in
# hybrid mode that already yields up to 10 deduplicated fused candidates
# for the reranker to reorder before generation_context_top_n=3 trims the
# final context -- not "reranking only the final 3 chunks". reranker.top_n
# is set to 5 (keep the whole reordered pool the reranker can usefully
# rank; generation_context_top_n=3, unchanged from baseline, is what
# actually determines how many reach the LLM prompt either way).
#
# Every component below is a "swap point": change `provider` (and its
# provider-specific block) to try a different embedding model, vector
# backend, chunker, reranker, or LLM without touching pipeline code.
#
# Secrets and host/port values are never hardcoded here: fields ending in
# `_env_var` name an environment variable that is resolved at load time by
# rag.config.Settings.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384 # must match model output dim; used to size the pgvector column

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: structured_markdown # swap point: recursive_character | structured_markdown
  chunk_size: 500
  chunk_overlap: 50
  structured_markdown:
    table_row_group_size: 20
    max_atomic_block_chars: 2000

reranker:
  provider: cross_encoder # only change vs multimodal-v2-relationship-qwen3b.yaml (was none)
  top_n: 5 # keep the whole reordered fused pool; generation_context_top_n=3 does the real trimming
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:3b
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.2
  max_tokens: 512
  prompt:
    id: rag_answer
    version: v2 # stricter grounding/refusal prompt
    path: src/rag/prompts/templates/rag_answer_v2.yaml

judge:
  provider: openai # swap point: openai | anthropic | ollama (ollama = local, for experimentation only)
  temperature: 0.0
  max_tokens: 1024
  openai:
    model_name: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
  anthropic:
    model_name: claude-haiku-4-5-20251001
    api_key_env_var: ANTHROPIC_API_KEY
  ollama:
    model_name: llama3.1:8b # deliberately distinct from generation.model_name

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db" # swap point: local sqlite file | a real MLflow tracking server URL
  experiment_name: local-rag-system

retrieval:
  provider: hybrid # unchanged vs baseline
  candidate_k: 5
  generation_context_top_n: 3 # unchanged vs baseline -- isolates the reranker's effect
  hybrid:
    rrf_k: 60
  relationship_expansion:
    enabled: true # unchanged vs baseline
    include_parent: true
    include_neighbors: true
    max_related_elements: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]

vision:
  provider: none # hosted vision OFF (Experiment C, not this milestone)
