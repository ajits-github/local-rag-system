# Experiment config: chunk_size changed (vs
# qwen2.5-3b_cross-encoder_bge-small.yaml) from 500 to 300. chunk_overlap
# stays 50 (not scaled down) -- only chunk_size was requested to change.
# Everything else (embedder, reranker, generation model, retrieval
# top_k/rerank_top_n) is identical to that config.
#
# IMPORTANT: chunk_size changes chunk boundaries, so existing chunks
# can't be reused -- this config must be used with a dataset_id ingested
# under *this* chunking, never an existing dataset_id chunked at size 500
# (see PROJECT_JOURNAL.md).
#
# Every component below is a "swap point": change `provider` (and its
# provider-specific block) to try a different embedding model, vector
# backend, chunker, reranker, or LLM without touching pipeline code.
#
# Secrets and host/port values are never hardcoded here: fields ending in
# `_env_var` name an environment variable that is resolved at load time by
# rag.config.Settings.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: BAAI/bge-small-en-v1.5 # same as qwen2.5-3b_cross-encoder_bge-small.yaml
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: recursive_character # swap point
  chunk_size: 300 # only change vs qwen2.5-3b_cross-encoder_bge-small.yaml (was 500)
  chunk_overlap: 50

reranker:
  provider: cross_encoder # same as qwen2.5-3b_cross-encoder_bge-small.yaml
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:3b # same as qwen2.5-3b_cross-encoder_bge-small.yaml
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.2
  max_tokens: 512

retrieval:
  top_k: 5
  rerank_top_n: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]
