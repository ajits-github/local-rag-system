# secure_rag_baseline_v1_auth_disabled: isolates the authorization variable.
#
# Byte-identical to secure-rag-baseline-v1.yaml except
# security.authorization.enabled: false. Used as the "before" side of the
# section-9 quality-impact A/B: run both against the same 84 benign
# (non-safety) questions and diff Recall@5/@10/MRR/supporting_context_hit_rate/
# answer_quality/refusal_rate to confirm authorization filtering doesn't
# regress ordinary retrieval quality on untenanted content. Never used as
# a "real" deployment config -- authorization.enabled: false only exists so
# this comparison config exists at all; config/default.yaml's own default
# is what a genuinely unconfigured deployment gets.
#
# Every component below is a "swap point": change `provider` (and its
# provider-specific block) to try a different embedding model, vector
# backend, chunker, reranker, or LLM without touching pipeline code.
#
# Secrets and host/port values are never hardcoded here: fields ending in
# `_env_var` name an environment variable that is resolved at load time by
# rag.config.Settings.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384 # must match model output dim; used to size the pgvector column

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: structured_markdown # swap point: recursive_character | structured_markdown
  chunk_size: 500
  chunk_overlap: 50
  structured_markdown:
    table_row_group_size: 20
    max_atomic_block_chars: 2000

reranker:
  provider: none # swap point: none | cross_encoder | cohere
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:3b
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.0 # matches classic_rag_baseline_v1's deterministic baseline
  max_tokens: 512
  seed: 42 # matches classic_rag_baseline_v1
  prompt:
    id: rag_answer
    version: v3 # safety milestone: explicit instruction/data boundary for retrieved context
    path: src/rag/prompts/templates/rag_answer_v3.yaml

judge:
  provider: openai # swap point: openai | anthropic | ollama (ollama = local, for experimentation only)
  temperature: 0.0
  max_tokens: 1024
  openai:
    model_name: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
  anthropic:
    model_name: claude-haiku-4-5-20251001
    api_key_env_var: ANTHROPIC_API_KEY
  ollama:
    model_name: llama3.1:8b # deliberately distinct from generation.model_name

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db" # swap point: local sqlite file | a real MLflow tracking server URL
  experiment_name: local-rag-system

retrieval:
  provider: hybrid # matches classic_rag_baseline_v1/experiment_015
  candidate_k: 5
  generation_context_top_n: 3
  hybrid:
    rrf_k: 60
  relationship_expansion:
    enabled: true # matches classic_rag_baseline_v1/experiment_015
    include_parent: true
    include_neighbors: true
    max_related_elements: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]

vision:
  provider: none # hosted vision OFF (not this milestone)

security:
  authorization:
    enabled: false # ONLY difference from secure-rag-baseline-v1.yaml
    cross_tenant_support_roles: ["techfusion_support"]
