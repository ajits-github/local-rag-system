# Experiment config: embedding model changed (vs
# qwen2.5-3b_cross-encoder.yaml) to BAAI/bge-small-en-v1.5. Generation
# model and reranker are unchanged from that config (both already differ
# from config/default.yaml -- see that file's header for the full
# lineage). BGE-small-en-v1.5 outputs 384-dim vectors, same as MiniLM, so
# the existing pgvector column size doesn't need to change.
#
# IMPORTANT: changing the embedder changes the vector space itself, so
# chunks embedded with a different model are not comparable. This config
# must be used with a dataset_id that was ingested using *this* embedder
# (see PROJECT_JOURNAL.md) -- never point it at the existing "techfusion"
# dataset_id, which holds MiniLM-embedded vectors.
#
# Every component below is a "swap point": change `provider` (and its
# provider-specific block) to try a different embedding model, vector
# backend, chunker, reranker, or LLM without touching pipeline code.
#
# Secrets and host/port values are never hardcoded here: fields ending in
# `_env_var` name an environment variable that is resolved at load time by
# rag.config.Settings.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: BAAI/bge-small-en-v1.5 # only change vs qwen2.5-3b_cross-encoder.yaml (was sentence-transformers/all-MiniLM-L6-v2)
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384 # BGE-small-en-v1.5 is also 384-dim; verified at ingestion time

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: recursive_character # swap point
  chunk_size: 500
  chunk_overlap: 50

reranker:
  provider: cross_encoder # same as qwen2.5-3b_cross-encoder.yaml
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:3b # same as qwen2.5-3b_cross-encoder.yaml
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.2
  max_tokens: 512

retrieval:
  top_k: 5
  rerank_top_n: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]
