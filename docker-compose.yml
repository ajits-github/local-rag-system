# Local development compose. Postgres+pgvector and the API run in
# containers; Ollama stays native on the Windows host (see README's
# "Containerized development" section for why, and the Linux equivalent of
# `host.docker.internal`).
#
# Requires Docker Compose V2 (`docker compose ...`, not the standalone V1
# `docker-compose`) — `deploy.resources.limits` below is only honored by V2
# outside of Swarm mode.
#
# For a production-shaped run (no source mounts, no --reload, tighter
# health-check timing), layer docker-compose.prod.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      # Host port is intentionally non-default; container side stays on 5432.
      - "${POSTGRES_HOST_PORT:-15987}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-rag-api
    restart: unless-stopped
    depends_on:
      postgres:
        # Hard dependency: the API can't do anything useful without the DB,
        # so wait for Postgres's own healthcheck above.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-ragdb}
      # Deliberately NOT ${OLLAMA_BASE_URL:-...}: .env's OLLAMA_BASE_URL is
      # for native/uvicorn-on-the-host runs (http://localhost:11434), which
      # inside a container would resolve to the container itself, not
      # Windows. CONTAINER_OLLAMA_BASE_URL is the container-specific
      # equivalent so the two never collide via compose's env substitution.
      # host.docker.internal resolves to the Windows/Mac host from inside
      # the container on Docker Desktop; extra_hosts below adds the same
      # resolution on Linux. Ollama itself is a *soft* dependency — the API
      # starts without it and GET /health reports "degraded" until it's
      # reachable, rather than the container refusing to start.
      OLLAMA_BASE_URL: ${CONTAINER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Dev-only: bind-mount source/config for uvicorn --reload. Removed in
      # docker-compose.prod.yml, where the image is treated as immutable.
      - ./src:/app/src
      - ./config:/app/config
      - ./data/uploads:/app/data/uploads
    command: ["uvicorn", "rag.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

volumes:
  pgdata:
