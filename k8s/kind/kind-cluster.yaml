# kind cluster for local Kubernetes learning against this repo.
#
# Two workers (plus the control-plane) so pod-to-node scheduling is real
# rather than degenerate, and so "what happens when a node dies" can be
# demonstrated by stopping one worker's container directly:
#   docker ps --filter "name=rag-learning-worker"
#   docker stop rag-learning-worker2
#
# The control-plane carries the ingress-ready label + port mappings
# exactly as ingress-nginx's own kind deployment recipe expects:
# https://kind.sigs.k8s.io/docs/user/ingress/
#
# Create with:
#   kind create cluster --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rag-learning
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Host 8080/8443 -> node 80/443, so the ingress controller's
      # NodePort/hostPort setup is reachable from Windows without
      # colliding with anything already bound to 80/443 on the host.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
