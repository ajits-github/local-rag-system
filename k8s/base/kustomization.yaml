apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap-app.yaml
  - secret-app.example.yaml
  - ollama-external-service.yaml
  - postgres-statefulset.yaml
  - rag-api-deployment.yaml
  - rag-api-service.yaml
  - rag-api-hpa.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Lets you retag both images from one place (e.g. after a rebuild with a
# version tag instead of ":kind") without hand-editing every Deployment:
#   kubectl kustomize k8s/base | ... (preview)
#   kubectl apply -k k8s/base
# For the "deploy a bad image/tag" rollout-failure exercise, prefer
# `kubectl set image` or `kubectl patch` against the live Deployment
# instead of editing this file -- see k8s/EXERCISES.md.
images:
  - name: local-rag-api
    newTag: kind
  - name: local-rag-frontend
    newTag: kind
