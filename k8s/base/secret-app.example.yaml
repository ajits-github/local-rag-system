# Kubernetes Secret objects are base64-encoded, not encrypted -- anyone who
# can `kubectl get secret -o yaml` in this namespace can read these values.
# That's fine for a local kind/minikube learning cluster; it would not be
# fine for a real deployment (see "Secret hardening" note in k8s/README.md).
#
# The values below are the exact same non-sensitive local-dev defaults
# already committed in .env.example (rag/rag) plus one clearly-labeled
# placeholder JWT signing secret -- never a real credential. Apply this
# file directly for local learning, or copy it to secret-app.local.yaml
# (add that filename to .gitignore) and edit it if you want different
# values without touching the tracked example.
#
# `stringData` lets you write plain values here; Kubernetes base64-encodes
# them into `data` itself on write -- you never hand-encode anything.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secret
  namespace: rag
type: Opaque
stringData:
  POSTGRES_PASSWORD: "rag"
  # Must match POSTGRES_USER/POSTGRES_DB in configmap-app.yaml and the
  # Service name in postgres-statefulset.yaml.
  DATABASE_URL: "postgresql://rag:rag@postgres.rag.svc.cluster.local:5432/ragdb"
  # security.auth.enabled is false by default (config/default.yaml), so this
  # is inert until an experiment config or override turns JWT auth on.
  JWT_HS256_SECRET: "dev-only-insecure-jwt-signing-secret-CHANGE-ME"
  # Only read when reranker.provider: cohere. Empty is fine otherwise.
  COHERE_API_KEY: ""
