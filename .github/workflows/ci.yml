# Default CI: fast, deterministic checks on every PR/push to main. No
# Ollama, no hosted-LLM judge calls, no RAGAS/MLflow, no secrets required --
# see CLAUDE.md's "Evaluation and experiment tracking" section for why those
# stay manual/opt-in workflows instead of running here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pre-commit's ruff/mypy hooks run in their own isolated envs (pinned
      # in .pre-commit-config.yaml), so this job only needs pre-commit
      # itself -- not the project's runtime/dev dependencies.
      - run: pip install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, ruff-format, mypy, hygiene hooks)
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      - name: Run unit tests
        run: pytest tests/unit -v --junitxml=pytest-unit.xml

      - name: Write test summary
        if: always()
        run: |
          {
            echo "### Unit test results"
            echo '```'
            python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('pytest-unit.xml').getroot()
          suite = root.find('testsuite') if root.tag == 'testsuites' else root
          print(f\"tests={suite.get('tests')} failures={suite.get('failures')} errors={suite.get('errors')} skipped={suite.get('skipped')} time={suite.get('time')}s\")
          "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-results
          path: pytest-unit.xml

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/ragdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      # Several integration tests exercise the real embedder. This is the
      # one unavoidable model download (~90MB, sentence-transformers/
      # all-MiniLM-L6-v2 per config/default.yaml) -- cached across runs so
      # only the first CI run after a model change pays for it.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Initialize schema (pgvector extension + tables)
        run: python scripts/init_db.py

      # Ollama isn't started here on purpose: tests gated on the
      # `require_ollama` fixture (tests/integration/conftest.py) skip
      # cleanly rather than failing when it's unreachable.
      - name: Run integration tests
        run: pytest tests/integration -v --junitxml=pytest-integration.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration-results
          path: pytest-integration.xml

  security-regression-gate:
    name: security-regression-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      # A curated subset of tests/unit, not the full suite the unit-tests job
      # already runs -- same tests, deliberately re-run under a distinctly
      # named, fast (no Postgres/Ollama) status check so a security or agent-
      # guardrail regression is unmistakable at a glance rather than buried
      # among ~400 unrelated unit tests. See docs/ci_eval_gates.md for why
      # this list, not the full suite, satisfies the milestone's zero-
      # tolerance security gates and agent-guardrail-behavior gates: every
      # file below asserts a deny/redact/bound/no-mutation outcome directly
      # (pass/fail, not a threshold), so nothing here needs check_eval_gates.py.
      - name: Run curated security + agent-guardrail regression tests
        run: |
          pytest -v --junitxml=pytest-security-regression.xml \
            tests/unit/test_authorization.py \
            tests/unit/test_field_policy.py \
            tests/unit/test_agent_tools_authorization_parity.py \
            tests/unit/test_api_query_auth_boundary.py \
            tests/unit/test_api_dos_limits.py \
            tests/unit/test_rate_limiting.py \
            tests/unit/test_mcp_identity.py \
            tests/unit/test_mcp_disabled_is_a_true_noop.py \
            tests/unit/test_mcp_business_case_store.py \
            tests/unit/test_mcp_business_case_actions.py \
            tests/unit/test_mcp_business_approvals.py \
            tests/unit/test_agent_tool_schemas.py \
            tests/unit/test_mcp_client_stage2.py \
            tests/unit/test_agent_graph_step_bound.py \
            tests/unit/test_agent_graph_retry_bound.py \
            tests/unit/test_agent_graph_insufficient_evidence.py \
            tests/unit/test_agent_graph_tool_failure.py \
            tests/unit/test_agent_graph_mcp_stage2.py \
            tests/unit/test_agent_classify_case_mutation_override.py \
            tests/unit/test_agent_graph_related_context_chunk_id_exposure.py \
            tests/unit/test_agent_tools_document_fetch_bounding.py \
            tests/unit/test_agent_tools_freshness.py \
            tests/unit/test_agent_tool_evidence_sanitization.py \
            tests/unit/test_run_agent_eval.py

      - name: Write test summary
        if: always()
        run: |
          {
            echo "### Security regression gate results"
            echo '```'
            python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('pytest-security-regression.xml').getroot()
          suite = root.find('testsuite') if root.tag == 'testsuites' else root
          print(f\"tests={suite.get('tests')} failures={suite.get('failures')} errors={suite.get('errors')} skipped={suite.get('skipped')} time={suite.get('time')}s\")
          "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-security-regression-results
          path: pytest-security-regression.xml

  retrieval-eval-gate:
    name: retrieval-eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/ragdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      # Same cache key as integration-tests -- both jobs load the exact same
      # embedding model (config/experiments/ci_eval.yaml matches
      # config/default.yaml's embedding block).
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Initialize schema (pgvector extension + tables)
        run: python scripts/init_db.py

      # data/knowledge_base (the real techfusion corpus) and its gold files
      # are gitignored and unavailable in CI (see CLAUDE.md's "Testing
      # conventions"), so this gate ingests the small, tracked, deterministic
      # CI sample corpus instead -- see docs/ci_eval_gates.md for why this is
      # not the same baseline as experiments/results/*.json.
      - name: Ingest the CI sample corpus
        run: |
          python -m rag.ingestion.pipeline data/sample_docs \
            --dataset-id ci_eval_sample \
            --config config/experiments/ci_eval.yaml \
            --clear

      - name: Run retrieval-only evaluation (no Ollama, no hosted judge)
        run: |
          python -m rag.eval.run_eval \
            --gold data/eval/sample_gold.jsonl \
            --dataset-id ci_eval_sample \
            --config config/experiments/ci_eval.yaml \
            --skip-generation \
            --verbose \
            --corpus-version "ci-${{ github.sha }}" \
            > eval_report.json

      - name: Check evaluation gates
        run: python scripts/check_eval_gates.py --report eval_report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-eval-report
          path: eval_report.json

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local-rag-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The postgres service above starts with an empty database -- no
      # `vector` extension, no tables. Without this, /health's vectorstore
      # check would report "unreachable" on every single call (the pgvector
      # type adapter can't register against a database that doesn't have
      # the extension yet), which used to exhaust the app's connection pool
      # under repeated polling. See PROJECT_JOURNAL.md for the full story;
      # the pool-exhaustion bug itself is now fixed at the code level
      # (src/rag/vectorstore/pgvector.py), but the schema still needs to
      # exist for this smoke test to assert a genuinely healthy container.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      - name: Initialize schema (pgvector extension + tables)
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5432/ragdb
        run: python scripts/init_db.py

      # --network host: on GitHub-hosted Linux runners this lets the
      # container reach the postgres service on localhost:5432 the same
      # way the job's own steps do, without wiring a user-defined network
      # just for one smoke-test container.
      - name: Run container
        run: |
          docker run -d --name rag-api-ci --network host \
            -e DATABASE_URL="postgresql://rag:rag@localhost:5432/ragdb" \
            local-rag-system:ci

      - name: Wait for /health and verify DB connectivity
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health | grep -q '^200$'; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "${READY:-0}" -ne 1 ]; then
            echo "Container never responded on /health"
            docker logs rag-api-ci
            exit 1
          fi

          HEALTH_JSON="$(curl -s http://localhost:8000/health)"
          echo "Response: $HEALTH_JSON"

          # Ollama isn't running in CI, so `dependencies.llm` is expected
          # to be "unreachable" here -- only vectorstore connectivity (the
          # part this job can actually prove) is asserted.
          VECTORSTORE_OK="$(echo "$HEALTH_JSON" | jq -r '.dependencies.vectorstore')"
          if [ "$VECTORSTORE_OK" != "ok" ]; then
            echo "Container could not reach Postgres (vectorstore: $VECTORSTORE_OK)"
            docker logs rag-api-ci
            exit 1
          fi
          echo "Container image builds, starts, and reaches Postgres+pgvector."

      - name: Container logs
        if: always()
        run: docker logs rag-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f rag-api-ci || true
