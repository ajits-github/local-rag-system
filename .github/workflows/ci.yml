# Default CI: fast, deterministic checks on every PR/push to main. No
# Ollama, no hosted-LLM judge calls, no RAGAS/MLflow, no secrets required --
# see CLAUDE.md's "Evaluation and experiment tracking" section for why those
# stay manual/opt-in workflows instead of running here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pre-commit's ruff/mypy hooks run in their own isolated envs (pinned
      # in .pre-commit-config.yaml), so this job only needs pre-commit
      # itself -- not the project's runtime/dev dependencies.
      - run: pip install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, ruff-format, mypy, hygiene hooks)
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      - name: Run unit tests
        run: pytest tests/unit -v --junitxml=pytest-unit.xml

      - name: Write test summary
        if: always()
        run: |
          {
            echo "### Unit test results"
            echo '```'
            python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('pytest-unit.xml').getroot()
          suite = root.find('testsuite') if root.tag == 'testsuites' else root
          print(f\"tests={suite.get('tests')} failures={suite.get('failures')} errors={suite.get('errors')} skipped={suite.get('skipped')} time={suite.get('time')}s\")
          "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-results
          path: pytest-unit.xml

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/ragdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .[dev]

      # Several integration tests exercise the real embedder. This is the
      # one unavoidable model download (~90MB, sentence-transformers/
      # all-MiniLM-L6-v2 per config/default.yaml) -- cached across runs so
      # only the first CI run after a model change pays for it.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Initialize schema (pgvector extension + tables)
        run: python scripts/init_db.py

      # Ollama isn't started here on purpose: tests gated on the
      # `require_ollama` fixture (tests/integration/conftest.py) skip
      # cleanly rather than failing when it's unreachable.
      - name: Run integration tests
        run: pytest tests/integration -v --junitxml=pytest-integration.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration-results
          path: pytest-integration.xml

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local-rag-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --network host: on GitHub-hosted Linux runners this lets the
      # container reach the postgres service on localhost:5432 the same
      # way the job's own steps do, without wiring a user-defined network
      # just for one smoke-test container.
      - name: Run container
        run: |
          docker run -d --name rag-api-ci --network host \
            -e DATABASE_URL="postgresql://rag:rag@localhost:5432/ragdb" \
            local-rag-system:ci

      - name: Wait for /health and verify DB connectivity
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health | grep -q '^200$'; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "${READY:-0}" -ne 1 ]; then
            echo "Container never responded on /health"
            docker logs rag-api-ci
            exit 1
          fi

          HEALTH_JSON="$(curl -s http://localhost:8000/health)"
          echo "Response: $HEALTH_JSON"

          # Ollama isn't running in CI, so `dependencies.llm` is expected
          # to be "unreachable" here -- only vectorstore connectivity (the
          # part this job can actually prove) is asserted.
          VECTORSTORE_OK="$(echo "$HEALTH_JSON" | jq -r '.dependencies.vectorstore')"
          if [ "$VECTORSTORE_OK" != "ok" ]; then
            echo "Container could not reach Postgres (vectorstore: $VECTORSTORE_OK)"
            docker logs rag-api-ci
            exit 1
          fi
          echo "Container image builds, starts, and reaches Postgres+pgvector."

      - name: Container logs
        if: always()
        run: docker logs rag-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f rag-api-ci || true
