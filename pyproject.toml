[project]
name = "local-rag-system"
version = "0.1.0"
description = "Modular, config-driven local RAG system (pgvector + Ollama + sentence-transformers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ollama>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
cohere = [
    "cohere>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
