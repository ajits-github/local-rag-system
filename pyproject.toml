[project]
name = "local-rag-system"
version = "0.1.0"
description = "Modular, config-driven local RAG system (pgvector + Ollama + sentence-transformers)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ollama>=0.3",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "mcp>=2.1,<3",  # official MCP Python SDK; v2 renamed FastMCP -> MCPServer, a hard break from v1
]

[project.optional-dependencies]
cohere = [
    "cohere>=5.0",
]
ragas = [
    "ragas>=0.3,<0.4",  # pulls in openai + datasets transitively
]
anthropic = [
    "anthropic>=0.34",  # ragas does NOT pull this in on its own
]
mlflow = [
    "mlflow>=2.14",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-htmlproofer-plugin>=1.2",  # validates internal links/anchors on `mkdocs build --strict`
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "httpx2>=2.5",  # a separate package from httpx (not a typo): the MCP SDK's own
    # transport client, already an unconditional dependency of the core `mcp` dep
    # above -- listed here explicitly, not just transitively, so the MCP test
    # suite's `import httpx2` (test_mcp_end_to_end.py/test_mcp_tenant_isolation.py)
    # never silently depends on how `mcp`'s own dependency tree happens to resolve
    "pre-commit>=3.8",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "types-PyYAML",
    "types-psycopg2",
    "reportlab>=4.0",  # test-only: builds real multi-page PDF fixtures for
    # tests/integration/test_layout_aware_ingestion.py's PDF path -- pdfplumber/
    # pypdf are PDF *readers*, this is the one PDF *writer* the test suite needs
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D107",  # __init__ is documented on the class docstring, not the method
    "D203",  # conflicts with D211 (no-blank-line-before-class)
    "D213",  # conflicts with D212 (multi-line summary on first line)
    "B008",  # FastAPI's Depends()/File()/Form() in defaults is idiomatic DI, not a bug
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D104"]  # test modules/classes don't need module/class docstrings
"scripts/**" = ["D100"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_community.*",
    "langchain_core.*",
    "langchain_text_splitters.*",
    "sentence_transformers.*",
    "pgvector.*",
    "cohere.*",
    "ollama.*",
    "docx.*",
    "pypdf.*",
    "pdfplumber.*",
    "bs4.*",
    "ragas.*",
    "datasets.*",
    "openai.*",
    "anthropic.*",
    "mlflow.*",
    "rank_bm25.*",
    "slowapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's shipped stubs use PEP 695 syntax mypy can only parse under
# python_version >= 3.12; skip following into them rather than bumping the
# project's target version just to satisfy a transitive dependency's stubs.
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true
