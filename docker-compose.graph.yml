# Optional local-development Knowledge Graph backend: Neo4j.
#
# Never brought up by `make up`/`docker-compose.yml` alone; entirely
# opt-in, layered on top:
#   docker compose -f docker-compose.yml -f docker-compose.graph.yml up -d
# or: make graph-up
#
# Bringing this up does not, by itself, enable graph retrieval: rag-api
# only builds a Neo4j client and runs graph extraction/retrieval when
# graph.enabled is true in config/default.yaml (default false). See
# docs/graphrag.md for the full design.
#
# Community edition (free, single-instance, no clustering) -- more than
# enough for this project's local-dev / learning-exercise scale (see
# "Performance and scaling" in docs/graphrag.md for the node-count
# benchmarks this was validated against). Memory bounds are set low,
# matching this project's existing 8GB-RAM CPU-only box constraint (see
# the postgres/rag-api `deploy.resources` blocks in docker-compose.yml).
services:
  rag-api:
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-please_change_me_neo4j}
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    container_name: local-rag-neo4j
    restart: unless-stopped
    environment:
      # NEO4J_AUTH is Neo4j's own "<user>/<password>" combined-credential
      # env var (not this project's usual single-value `*_env_var`
      # pattern) -- required by the official image itself, so it stays as
      # the image expects it rather than inventing a different shape.
      # Never hardcoded: sourced from .env like every other credential in
      # this repo, with the same "safe local-dev default, always
      # overridable" convention docker-compose.yml already uses for
      # POSTGRES_USER/POSTGRES_PASSWORD.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please_change_me_neo4j}
      # Keep memory small and bounded for an 8GB-RAM CPU-only dev box.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HOST_HTTP_PORT:-7474}:7474" # Neo4j Browser (human inspection of the graph)
      - "${NEO4J_HOST_BOLT_PORT:-7687}:7687" # Bolt protocol (the driver's actual connection)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

volumes:
  neo4j_data:
  neo4j_logs:
