repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: docker-compose.prod.yml uses Compose's !override tag,
        # which plain YAML (and this hook's default loader) doesn't know
        # how to construct. --unsafe checks syntax only, without trying
        # to resolve custom tags into Python objects.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - types-PyYAML
          - types-psycopg2
          - fastapi>=0.115
          - python-dotenv>=1.0
        args: [--config-file=pyproject.toml]
        files: ^src/
