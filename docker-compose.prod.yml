# Production-shaped override layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Optional prod env file:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    restart: always
    # Remove the host port published by docker-compose.yml.
    ports: !override []
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5

  rag-api:
    restart: always
    # Swap to a registry image once CI publishes one.
    # image: registry.example.com/local-rag-system:latest
    # Replace dev bind mounts; keep uploaded documents persistent.
    volumes: !override
      - ./data/uploads:/app/data/uploads
    command: ["uvicorn", "rag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
