# Default configuration for local-rag-system.
#
# Every component below is a "swap point": change `provider` (and its
# provider-specific block) to try a different embedding model, vector
# backend, chunker, reranker, or LLM without touching pipeline code.
#
# Secrets and host/port values are never hardcoded here — fields ending in
# `_env_var` name an environment variable that is resolved at load time by
# rag.config.Settings.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384 # must match model output dim; used to size the pgvector column

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: structured_markdown # swap point: recursive_character | structured_markdown
  chunk_size: 500
  chunk_overlap: 50
  structured_markdown:
    table_row_group_size: 20
    max_atomic_block_chars: 2000

reranker:
  provider: none # swap point: none | cross_encoder | cohere
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:1.5b
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.2
  max_tokens: 512
  seed: null # swap point: set an int (e.g. 42) for reproducible Ollama sampling; null = non-deterministic
  prompt:
    id: rag_answer
    version: v1
    path: src/rag/prompts/templates/rag_answer_v1.yaml

judge:
  provider: openai # swap point: openai | anthropic | ollama (ollama = local, for experimentation only)
  temperature: 0.0
  max_tokens: 1024
  openai:
    model_name: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
  anthropic:
    model_name: claude-haiku-4-5-20251001
    api_key_env_var: ANTHROPIC_API_KEY
  ollama:
    model_name: llama3.1:8b # deliberately distinct from generation.model_name

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db" # swap point: local sqlite file | a real MLflow tracking server URL
  experiment_name: local-rag-system

observability:
  metrics:
    enabled: true # default-on; in-process only, harmless unless something scrapes /metrics
    path: /metrics
  tracing:
    enabled: false # no-op when false; see docs/architecture.md. Requires an OTLP endpoint (Jaeger) to be useful
    service_name: local-rag-system
    sample_ratio: 1.0
  live_events:
    enabled: true # mounts POST /agent/query/stream; no external dependency

retrieval:
  provider: dense # swap point: dense | hybrid (BM25 + dense, fused via RRF)
  candidate_k: 5
  generation_context_top_n: 3
  hybrid:
    rrf_k: 60
  relationship_expansion:
    enabled: false # no-op when false; see docs/architecture.md
    include_parent: true
    include_neighbors: true
    max_related_elements: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]
  layout_parsing:
    pdf_parser: pdfplumber # swap point: only parser implemented so far; see docs/architecture.md
    heading_font_size_ratio: 1.15
    title_font_size_ratio: 1.8
    max_heading_words: 12

vision:
  provider: none # swap point: none (default/no-op) or ollama (local, offline); see docs/architecture.md
  ollama:
    model_name: moondream # operator must `ollama pull moondream` -- not installed automatically
    prompt_version: v1

security:
  authorization:
    enabled: false # no-op when false; see docs/architecture.md and config/experiments/secure-rag-baseline-v1.yaml
    cross_tenant_support_roles: ["techfusion_support"]
  field_redaction:
    enabled: false # no-op when false; see config/experiments/secure-rag-baseline-v1-field-redaction.yaml
  auth:
    enabled: false # no-op when false; see docs/architecture.md and config/experiments/secure-rag-baseline-v2-jwt-auth.yaml
    insecure_dev_mode: false # only relevant when enabled=true; never overrides a present-but-invalid JWT
    ingest_roles: ["security_admin", "system_admin", "techfusion_support"]
    jwt:
      algorithm: HS256 # swap point: HS256 | RS256 | ES256
      secret_env_var: JWT_HS256_SECRET
      public_key_path_env_var: JWT_PUBLIC_KEY_PATH
      issuer: null # null = issuer claim not checked
      audience: null # null = audience claim not checked
      leeway_seconds: 30
      required_claims: ["sub", "tenant_id", "roles"]
  dos_limits:
    max_query_length: 2000
    max_top_k: 20
    max_filters_bytes: 4096
    max_upload_bytes: 26214400 # 25 MiB
  rate_limit:
    enabled: false # no-op when false; in-process/single-instance limiter, see docs/architecture.md
    requests_per_minute: 60
    key: tenant # swap point: tenant | ip
  egress_policy:
    enabled: false # no-op when false; gates hosted RAGAS judge calls only, see docs/architecture.md
    block_unredacted_sensitive_fields: true
    require_authoritative_trust: false
    blocked_tenant_ids: []
    classification_policy:
      public: true
      internal: true
      confidential: false
      restricted: false

agent:
  enabled: true # no-op when false; classify_query always routes to classic_rag, see docs/architecture.md
  max_agent_steps: 8
  max_retrieval_attempts: 2
  max_tool_calls: 6
  max_json_parse_retries: 1
  max_tool_top_k: 20
  max_chunks_per_document_fetch: 10
  max_chunks_per_document_fetch_hard_ceiling: 50
  classify_prompt_path: src/rag/prompts/templates/agent_classify_v1.yaml
  decompose_prompt_path: src/rag/prompts/templates/agent_decompose_v1.yaml
  tool_select_prompt_path: src/rag/prompts/templates/agent_tool_select_v3.yaml
  evidence_sufficiency_prompt_path: src/rag/prompts/templates/agent_evidence_sufficiency_v1.yaml
  synthesize_prompt_path: src/rag/prompts/templates/agent_synthesize_v1.yaml

mcp:
  enabled: false # no-op when false; the MCP ASGI app is never mounted. Governed by security.auth, no separate mcp.auth block
  server:
    mount_path: /mcp
  business_actions:
    enabled: false # no-op when false; update_case_status is not registered on the MCP server at all
