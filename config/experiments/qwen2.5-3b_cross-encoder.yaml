# Experiment config: generation model (vs config/default.yaml) AND
# reranker (vs config/experiments/qwen2.5-3b.yaml) both changed. Embedding,
# chunking, vector store, and retrieval top_k are identical to both.
#
# This is a clean single-variable isolation against
# config/experiments/qwen2.5-3b.yaml (reranker only: none -> cross_encoder)
# but NOT against config/default.yaml (two variables differ: generation
# model and reranker) -- see PROJECT_JOURNAL.md for how that's accounted
# for in the analysis.
#
# Every component below is a "swap point": change `provider` (and its
# provider-specific block) to try a different embedding model, vector
# backend, chunker, reranker, or LLM without touching pipeline code.
#
# Secrets and host/port values are never hardcoded here: fields ending in
# `_env_var` name an environment variable that is resolved at load time by
# rag.config.Settings.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384 # must match model output dim; used to size the pgvector column

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: recursive_character # swap point
  chunk_size: 500
  chunk_overlap: 50

reranker:
  provider: cross_encoder # only change vs qwen2.5-3b.yaml (was none)
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:3b # same as qwen2.5-3b.yaml (was qwen2.5:1.5b in default.yaml)
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.2
  max_tokens: 512

retrieval:
  top_k: 5
  rerank_top_n: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]
