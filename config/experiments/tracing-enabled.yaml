# tracing-enabled: identical to config/default.yaml except
# observability.tracing.enabled: false -> true.
#
# Not an eval/experiment-tracking config in the usual sense (no retrieval/
# generation/security axis changes); this is a local-development convenience for
# turning on OpenTelemetry export without editing the committed default.
# Only useful once a real OTLP endpoint is reachable (docker-compose
# .observability.yml's Jaeger, or OTEL_EXPORTER_OTLP_ENDPOINT pointed
# elsewhere); tracing is a true no-op otherwise. Run it explicitly via
# RAG_CONFIG_PATH, e.g.:
#
#   RAG_CONFIG_PATH=/app/config/experiments/tracing-enabled.yaml \
#     docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# config/default.yaml itself is never edited for this. This follows the
# "experiment config overlay, not a promoted default" pattern CLAUDE.md documents for
# every other config/experiments/*.yaml file.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384

vectorstore:
  provider: pgvector
  connection_env_var: DATABASE_URL
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: structured_markdown
  chunk_size: 500
  chunk_overlap: 50
  structured_markdown:
    table_row_group_size: 20
    max_atomic_block_chars: 2000

reranker:
  provider: none
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama
  model_name: qwen2.5:1.5b
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.2
  max_tokens: 512
  seed: null
  prompt:
    id: rag_answer
    version: v1
    path: src/rag/prompts/templates/rag_answer_v1.yaml

judge:
  provider: openai
  temperature: 0.0
  max_tokens: 1024
  openai:
    model_name: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
  anthropic:
    model_name: claude-haiku-4-5-20251001
    api_key_env_var: ANTHROPIC_API_KEY
  ollama:
    model_name: llama3.1:8b

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: local-rag-system

observability:
  metrics:
    enabled: true
    path: /metrics
  tracing:
    enabled: true # the one field that differs from config/default.yaml
    service_name: local-rag-system
    sample_ratio: 1.0
  live_events:
    enabled: true

retrieval:
  provider: dense
  candidate_k: 5
  generation_context_top_n: 3
  hybrid:
    rrf_k: 60
  relationship_expansion:
    enabled: false
    include_parent: true
    include_neighbors: true
    max_related_elements: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]
  layout_parsing:
    pdf_parser: pdfplumber
    heading_font_size_ratio: 1.15
    title_font_size_ratio: 1.8
    max_heading_words: 12

vision:
  provider: none
  ollama:
    model_name: moondream
    prompt_version: v1

security:
  authorization:
    enabled: false
    cross_tenant_support_roles: ["techfusion_support"]
  field_redaction:
    enabled: false
  auth:
    enabled: false
    insecure_dev_mode: false
    ingest_roles: ["security_admin", "system_admin", "techfusion_support"]
    jwt:
      algorithm: HS256
      secret_env_var: JWT_HS256_SECRET
      public_key_path_env_var: JWT_PUBLIC_KEY_PATH
      issuer: null
      audience: null
      leeway_seconds: 30
      required_claims: ["sub", "tenant_id", "roles"]
  dos_limits:
    max_query_length: 2000
    max_top_k: 20
    max_filters_bytes: 4096
    max_upload_bytes: 26214400
  rate_limit:
    enabled: false
    requests_per_minute: 60
    key: tenant
  egress_policy:
    enabled: false
    block_unredacted_sensitive_fields: true
    require_authoritative_trust: false
    blocked_tenant_ids: []
    classification_policy:
      public: true
      internal: true
      confidential: false
      restricted: false

agent:
  enabled: true
  max_agent_steps: 8
  max_retrieval_attempts: 2
  max_tool_calls: 6
  max_json_parse_retries: 1
  max_tool_top_k: 20
  max_chunks_per_document_fetch: 10
  max_chunks_per_document_fetch_hard_ceiling: 50
  classify_prompt_path: src/rag/prompts/templates/agent_classify_v1.yaml
  decompose_prompt_path: src/rag/prompts/templates/agent_decompose_v1.yaml
  tool_select_prompt_path: src/rag/prompts/templates/agent_tool_select_v2.yaml
  evidence_sufficiency_prompt_path: src/rag/prompts/templates/agent_evidence_sufficiency_v1.yaml
  synthesize_prompt_path: src/rag/prompts/templates/agent_synthesize_v1.yaml
