# agentic_rag_specialized_tool_eval: agentic-rag-baseline-v3-chunk-id-fix.yaml
# (experiment_040's config, the established agentic-RAG baseline) plus one
# addition: the mcp: block, turning on the remote MCP business tools
# (get_customer_case/get_case_status/update_case_status) so run_agent_eval.py
# can actually reach them. Every other field is BYTE-IDENTICAL to
# agentic-rag-baseline-v3-chunk-id-fix.yaml -- generation model, prompts,
# retrieval settings, and every other security toggle are unchanged.
#
# agent.tool_select_prompt_path stays pointed at v3 (the 4-local-tool
# prompt): it is only the FALLBACK used when mcp.client.enabled=False.
# With mcp.client.enabled=True here, rag.agent.graph._load_templates
# automatically loads agent_tool_select_v4_mcp.yaml (6 tools) instead --
# and, since mcp.business_actions.enabled is also true here,
# agent_tool_select_v5_mcp_actions.yaml (all 7 tools) -- via
# config.agent's own tool_select_mcp_prompt_path/
# tool_select_mcp_actions_prompt_path defaults, with no yaml override
# needed. No agent prompt or tool-selection logic was changed to produce
# this config; it only flips existing, pre-existing kill-switches on.
#
# mcp.client.transport stays at its "asgi" default: run_agent_eval.py's
# own run() function builds the same in-process MCP ASGI app object this
# config's mcp.enabled=true would have main.py mount, and calls the
# remote business tools through it via an in-memory transport -- no real
# socket, no separate server process to start.

app:
  name: local-rag-system
  log_level: INFO

embedding:
  provider: sentence_transformers # swap point
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true
  dimension: 384 # must match model output dim; used to size the pgvector column

vectorstore:
  provider: pgvector # swap point (future: chroma, faiss, ...)
  connection_env_var: DATABASE_URL # never hardcode host/port/credentials
  documents_table: documents
  chunks_table: chunks
  distance_metric: cosine

chunking:
  provider: structured_markdown # swap point: recursive_character | structured_markdown
  chunk_size: 500
  chunk_overlap: 50
  structured_markdown:
    table_row_group_size: 20
    max_atomic_block_chars: 2000

reranker:
  provider: none # swap point: none | cross_encoder | cohere
  cross_encoder:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  cohere:
    model_name: rerank-english-v3.0
    api_key_env_var: COHERE_API_KEY

generation:
  provider: ollama # swap point
  model_name: qwen2.5:3b
  base_url_env_var: OLLAMA_BASE_URL
  temperature: 0.0 # matches experiment_040
  max_tokens: 512
  seed: 42 # matches experiment_040
  prompt:
    id: rag_answer
    version: v3
    path: src/rag/prompts/templates/rag_answer_v3.yaml

judge:
  provider: openai # swap point: openai | anthropic | ollama (ollama = local, for experimentation only)
  temperature: 0.0
  max_tokens: 1024
  cache_enabled: true
  cache_dir: .cache/ragas
  openai:
    model_name: gpt-4o-mini
    api_key_env_var: OPENAI_API_KEY
  anthropic:
    model_name: claude-haiku-4-5-20251001
    api_key_env_var: ANTHROPIC_API_KEY
  ollama:
    model_name: llama3.1:8b # deliberately distinct from generation.model_name

mlflow:
  enabled: false # this is a specialized-tool eval subset, not a recorded benchmark run

retrieval:
  provider: hybrid # matches experiment_040
  candidate_k: 5
  generation_context_top_n: 3
  hybrid:
    rrf_k: 60
  relationship_expansion:
    enabled: true # matches experiment_040
    include_parent: true
    include_neighbors: true
    max_related_elements: 3

ingestion:
  supported_extensions: [".pdf", ".docx", ".html", ".htm", ".txt", ".md"]

vision:
  provider: none # hosted vision OFF (not this milestone)

agent:
  enabled: true # agentic-RAG toggle; see src/rag/agent/graph.py
  max_agent_steps: 8
  max_retrieval_attempts: 2
  max_tool_calls: 6
  max_json_parse_retries: 1
  max_tool_top_k: 20
  max_chunks_per_document_fetch: 10
  max_chunks_per_document_fetch_hard_ceiling: 50
  classify_prompt_path: src/rag/prompts/templates/agent_classify_v2.yaml # unchanged from experiment_040
  decompose_prompt_path: src/rag/prompts/templates/agent_decompose_v1.yaml # unchanged
  tool_select_prompt_path: src/rag/prompts/templates/agent_tool_select_v3.yaml # fallback only; unused while mcp.client.enabled=true
  evidence_sufficiency_prompt_path: src/rag/prompts/templates/agent_evidence_sufficiency_v1.yaml # unchanged
  synthesize_prompt_path: src/rag/prompts/templates/agent_synthesize_v2.yaml # unchanged from experiment_040

mcp:
  enabled: true # mounts the MCP server object run_agent_eval.py's run() calls the agent's remote tools through
  server:
    mount_path: /mcp
  client:
    enabled: true # the ONE real change from agentic-rag-baseline-v3-chunk-id-fix.yaml
    transport: asgi
  business_actions:
    enabled: true # registers update_case_status so the safe-outcome write-action gold rows are reachable at all
    approval_roles: ["case_status_approver"]
    max_case_approvals_per_request: 5

security:
  authorization:
    enabled: true # unchanged from experiment_040; exercises auth-parity fix
    cross_tenant_support_roles: ["techfusion_support"]
  field_redaction:
    enabled: true # unchanged from experiment_040
  auth:
    enabled: true # unchanged from experiment_040; also required for mcp.client.enabled=true
    insecure_dev_mode: false
    ingest_roles: ["security_admin", "system_admin", "techfusion_support"]
    jwt:
      algorithm: HS256
      secret_env_var: JWT_HS256_SECRET
      public_key_path_env_var: JWT_PUBLIC_KEY_PATH
      issuer: null
      audience: null
      leeway_seconds: 30
      required_claims: ["sub", "tenant_id", "roles"]
  dos_limits:
    max_query_length: 2000
    max_top_k: 20
    max_filters_bytes: 4096
    max_upload_bytes: 26214400
  rate_limit:
    enabled: false # not the focus of this evaluation
    requests_per_minute: 60
    key: tenant
  egress_policy:
    enabled: true # unchanged from experiment_040
    block_unredacted_sensitive_fields: true
    require_authoritative_trust: false
    blocked_tenant_ids: []
    classification_policy:
      public: true
      internal: true
      confidential: false
      restricted: false
